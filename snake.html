<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
/* Theme colors and app-wide layout settings. */
:root {
  color-scheme: light;
  --bg: #e9efe4;
  --board: #cfdcc4;
  --grid: #c3d2b7;
  --snake: #2f5d3a;
  --head: #1d3d26;
  --food: #c8402d;
  --text: #1f2d22;
  --muted: #5c6e5f;
  --btn: #2f5d3a;
  --btn-text: #f3f7ef;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a15;
    --board: #1c2720;
    --grid: #223027;
    --snake: #7fbf8a;
    --head: #b4e6bc;
    --food: #ef6a55;
    --text: #e3ece5;
    --muted: #8aa08f;
    --btn: #7fbf8a;
    --btn-text: #0f1a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a15; --board: #1c2720; --grid: #223027; --snake: #7fbf8a; --head: #b4e6bc;
  --food: #ef6a55; --text: #e3ece5; --muted: #8aa08f; --btn: #7fbf8a; --btn-text: #0f1a12;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 12px; box-sizing: border-box;
}
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
.hud { display: flex; align-items: center; gap: 24px; font-size: 1rem; color: var(--muted); }
.hud b { color: var(--text); font-variant-numeric: tabular-nums; }
.hud button { padding: 7px 14px; font-size: .9rem; }
.wrap { position: relative; width: min(92vw, 420px); }
canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--board); touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; text-align: center; border-radius: 8px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
}
.overlay[hidden] { display: none; }
.overlay p { margin: 0; font-size: 1.1rem; }
button {
  font: inherit; font-weight: 700; background: var(--btn); color: var(--btn-text);
  border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; }
.pad button { padding: 0; font-size: 1.3rem; }
.pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.hint { margin: 0; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<h1>Snake</h1>
<div class="hud">
  <span>Score <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
  <button id="pause" type="button" aria-pressed="false" disabled>Pause</button>
</div>
<div class="wrap">
  <canvas id="c" width="420" height="420" aria-label="Snake game board"></canvas>
  <div class="overlay" id="overlay">
    <p id="msg">Eat the red food. Don’t hit walls or yourself.</p>
    <button id="start">Start game</button>
  </div>
</div>
<div class="pad" aria-label="Direction controls">
  <button class="up" data-d="up" aria-label="Up">▲</button>
  <button class="left" data-d="left" aria-label="Left">◀</button>
  <button class="down" data-d="down" aria-label="Down">▼</button>
  <button class="right" data-d="right" aria-label="Right">▶</button>
</div>
<p class="hint">Swipe or use the direction buttons, arrow keys, or WASD to steer. Space to pause.</p>

<script>
(function () {
  // Game board size: 21 x 21 cells, each cell is 20 pixels.
  var N = 21, S = 20;

  // Cache DOM elements used throughout the game.
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay'), msg = document.getElementById('msg');
  var startBtn = document.getElementById('start'), pauseBtn = document.getElementById('pause');
  var themeKey = 'kingsdata-theme';

  // Game state variables. snake stores segments, dir is current direction,
  // next is the queued direction, and food tracks the current target.
  var snake, dir, next, food, score, timer, running = false, paused = false;
  var best = 0;

  // Restore the saved best score if the browser has one.
  try { best = parseInt(localStorage.getItem('snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // Direction vector map for movement updates.
  var V = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  // Read a CSS variable value from the document root.
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function readTheme() {
    try {
      return localStorage.getItem(themeKey) === 'dark' ? 'dark' : 'light';
    } catch (error) {
      console.warn('Unable to read the saved theme preference.', error);
      return 'light';
    }
  }

  function setTheme(theme) {
    if (theme !== 'light' && theme !== 'dark') return;
    document.documentElement.dataset.theme = theme;
    draw();
  }

  // Reset the game board to a fresh starting snake position.
  function reset() {
    var m = Math.floor(N / 2);
    snake = [{ x: m, y: m }, { x: m - 1, y: m }, { x: m - 2, y: m }];
    dir = V.right; next = dir; score = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  // Place the food in a random empty cell.
  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++)
      if (!snake.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // Start a new game round. This resets the board and begins the timer loop.
  function start() {
    reset(); running = true; paused = false;
    pauseBtn.disabled = false;
    updatePauseButton();
    overlay.hidden = true;
    clearInterval(timer);
    timer = setInterval(tick, 120);
    draw();
  }

  function updatePauseButton() {
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    updatePauseButton();
  }

  // End the current game and show the overlay with the result message.
  function end(text) {
    running = false; paused = false; clearInterval(timer);
    pauseBtn.disabled = true;
    updatePauseButton();
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    msg.textContent = text + ' Score: ' + score + '.';
    startBtn.textContent = 'Play again';
    overlay.hidden = false;
  }

  // Run one game step: update snake position, detect collisions, and grow on food.
  function tick() {
    if (paused) return;
    dir = next;
    var h = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };

    // Wall collision ends the run.
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) return end('You hit the wall.');

    // If the next head position lands on food, the snake grows instead of shrinking.
    var willGrow = food && h.x === food.x && h.y === food.y;
    var body = willGrow ? snake : snake.slice(0, -1);

    // Collision with the snake's own body ends the run.
    if (body.some(function (s) { return s.x === h.x && s.y === h.y; })) return end('You hit yourself.');

    snake.unshift(h);
    if (willGrow) {
      score++; scoreEl.textContent = score; placeFood();
      if (!food) return end('You filled the board!');
    } else snake.pop();
    draw();
  }

  // Draw the board, food, and snake using the canvas API.
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = css('--grid');

    // Draw the checkerboard background for the board.
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++)
      if ((x + y) % 2) ctx.fillRect(x * S, y * S, S, S);

    if (food) {
      ctx.fillStyle = css('--food');
      ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 3, 0, Math.PI * 2); ctx.fill();
    }

    // Draw the snake head and body segments.
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? css('--head') : css('--snake');
      ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
    });
  }

  // Update direction only if the new move is not a reversal of the current heading.
  function steer(name) {
    var v = V[name];
    if (!v || !running) return;
    if (v[0] === -dir[0] && v[1] === -dir[1]) return;
    next = v;
  }

  // Keyboard controls for desktop play.
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    var map = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    if (map[k]) { e.preventDefault(); steer(map[k]); }
    else if (k === ' ' && running) { e.preventDefault(); togglePause(); }
    else if (k === 'enter' && !running && document.activeElement !== startBtn) start();
  });

  // Button controls for touch and mouse-friendly play.
  Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (b) {
    b.addEventListener('click', function () { steer(b.dataset.d); });
  });

  // Touch swipe controls: detect the drag direction and convert it to a game move.
  var tx, ty;
  cv.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  // Start button triggers the first game round.
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', togglePause);
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || !event.data || event.data.type !== 'theme-change') return;
    setTheme(event.data.theme);
  });
  window.addEventListener('storage', function (event) {
    if (event.key === themeKey) setTheme(event.newValue === 'dark' ? 'dark' : 'light');
  });

  // Initialize the first render before the user starts playing.
  reset();
  setTheme(readTheme());
})();
</script>
</body>
</html>
